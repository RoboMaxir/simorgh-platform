version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: simorgh_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simorgh_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: simorgh_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/simorgh_platform
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      ALLOWED_HOSTS: "*"
      # AI Provider Configuration
      DEFAULT_OPENAI_COMPATIBLE_BASE_URL: ${AI_BASE_URL:-}
      DEFAULT_OPENAI_COMPATIBLE_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/v1/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
