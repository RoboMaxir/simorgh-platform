<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge - SIMORGH Platform</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="dashboard.html" class="nav-logo">SIMORGH</a>
      <ul class="nav-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li class="nav-item"><a href="applications.html" class="nav-link">Applications</a></li>
        <li class="nav-item"><a href="credentials.html" class="nav-link">API Keys</a></li>
        <li class="nav-item"><a href="usage.html" class="nav-link">Usage</a></li>
        <li class="nav-item"><a href="billing.html" class="nav-link">Credits</a></li>
        <li class="nav-item"><a href="knowledge.html" class="nav-link active">Knowledge</a></li>
        <li class="nav-item"><a href="logs.html" class="nav-link">Logs</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Knowledge Foundation</h1>
        <div class="user-info">
          <button id="logout-btn" class="btn btn-secondary">Logout</button>
        </div>
      </header>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Knowledge Spaces</h3>
        </div>
        <div class="card-body">
          <p class="mb-0">Organize your documents into knowledge spaces for efficient retrieval and search.</p>
        </div>
      </div>

      <div id="knowledge-spaces">
        <div class="card"><p>Loading knowledge spaces...</p></div>
      </div>
    </main>

    <!-- Create Space Modal -->
    <div id="create-space-modal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">Create Knowledge Space</h3>
          <button class="modal-close" onclick="app.closeCreateSpaceModal()">&times;</button>
        </div>
        <form onsubmit="app.handleCreateSpace(event)">
          <div class="form-group">
            <label class="form-label" for="space-name">Space Name</label>
            <input type="text" id="space-name" name="space-name" class="form-input" required placeholder="e.g., Research Library">
          </div>
          <div class="form-group">
            <label class="form-label" for="space-description">Description (Optional)</label>
            <textarea id="space-description" name="space-description" class="form-textarea" placeholder="Describe the purpose of this space"></textarea>
          </div>
          <div class="flex gap-2 justify-between">
            <button type="button" class="btn btn-secondary" onclick="app.closeCreateSpaceModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Space</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
