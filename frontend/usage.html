<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usage - SIMORGH Platform</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="dashboard.html" class="nav-logo">SIMORGH</a>
      <ul class="nav-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li class="nav-item"><a href="applications.html" class="nav-link">Applications</a></li>
        <li class="nav-item"><a href="credentials.html" class="nav-link">API Keys</a></li>
        <li class="nav-item"><a href="usage.html" class="nav-link active">Usage</a></li>
        <li class="nav-item"><a href="billing.html" class="nav-link">Credits</a></li>
        <li class="nav-item"><a href="knowledge.html" class="nav-link">Knowledge</a></li>
        <li class="nav-item"><a href="logs.html" class="nav-link">Logs</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Usage Analytics</h1>
        <div class="user-info">
          <button id="logout-btn" class="btn btn-secondary">Logout</button>
        </div>
      </header>

      <!-- Filters -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Filters</h3>
        </div>
        <div class="card-body">
          <form id="usage-filters" class="flex gap-4 items-center">
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="start-date">Start Date</label>
              <input type="date" id="start-date" class="form-input">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="end-date">End Date</label>
              <input type="date" id="end-date" class="form-input">
            </div>
            <div class="form-group" style="margin-bottom: 0; display: flex; align-items: flex-end;">
              <button type="submit" class="btn btn-primary">Apply Filters</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Usage Stats -->
      <div id="usage-data">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Requests</div>
            <div class="stat-value">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Input Tokens</div>
            <div class="stat-value">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Output Tokens</div>
            <div class="stat-value">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Cost</div>
            <div class="stat-value">-</div>
          </div>
        </div>
      </div>

      <!-- Usage Chart Placeholder -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Usage Over Time</h3>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <p>Chart visualization would be implemented here with a library like Chart.js</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Set default date range (last 30 days)
    document.addEventListener('DOMContentLoaded', () => {
      const endDate = new Date();
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 30);
      
      document.getElementById('end-date').value = endDate.toISOString().split('T')[0];
      document.getElementById('start-date').value = startDate.toISOString().split('T')[0];
      
      document.getElementById('usage-filters').addEventListener('submit', (e) => {
        e.preventDefault();
        if (app) app.loadUsage();
      });
    });
  </script>
</body>
</html>
